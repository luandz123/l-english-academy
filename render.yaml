# Render Blueprint — backend production (ADR 0003). Render → New → Blueprint → chọn repo này.
# Deploy tự động mỗi khi nhánh main thay đổi. Container chạy `prisma migrate deploy` trước khi
# khởi động app (backend/docker-entrypoint.sh): migration lỗi → container thoát, health check
# không đạt, Render giữ bản đang chạy. Không phụ thuộc GitHub Actions.
services:
  - type: web
    name: lenglish-api
    runtime: docker
    region: singapore
    plan: free
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Vercel rewrite + Render proxy
      - key: TRUST_PROXY_HOPS
        value: "2"
      - key: AUTH_REQUIRE_EMAIL_CONFIRMATION
        value: "true"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      # Các biến dưới đây nhập tay trên Render (sync: false = không lưu giá trị trong repo)
      - key: DATABASE_URL # Neon pooled (host có -pooler), sslmode=verify-full
        sync: false
      - key: DATABASE_URL_UNPOOLED # Neon direct (không -pooler), cho `prisma migrate deploy` lúc khởi động
        sync: false
      - key: FRONTEND_URL # https://<domain production>
        sync: false
      - key: CORS_ORIGINS # cùng giá trị FRONTEND_URL
        sync: false
      # Render free chặn mọi cổng SMTP ra ngoài (từ 26/09/2025) → gửi thư qua Gmail API (HTTPS).
      # Cách tạo client + refresh token: docs/STAGING.md §2.5
      - key: MAIL_PROVIDER
        value: gmail_api
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: MAIL_FROM # L-English Academy <gmail-đã-cấp-quyền@gmail.com>
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SEPAY_WEBHOOK_API_KEY # >= 16 ký tự, khai cùng giá trị ở SePay > Webhooks > API Key
        sync: false
      - key: PAYMENT_SIMULATION_ENABLED # production: "false". Chỉ đặt "true" ở môi trường thử
        sync: false
      # Supabase Storage (T-026)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Nhận giọng shadowing bằng Whisper (Groq). Bỏ trống → chỉ chấm bằng trình duyệt
      - key: STT_API_KEY
        sync: false
